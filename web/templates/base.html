<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% if auto_refresh %}
  <meta http-equiv="refresh" content="60">
  {% endif %}
  <title>{% block title %}WhopScraper{% endblock %} | Trading Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-size: 14px; }
    .navbar { background-color: #161b22 !important; border-bottom: 1px solid #30363d; }
    .navbar-brand, .nav-link { color: #f0f6fc !important; }
    .nav-link:hover, .nav-link.active { color: #58a6ff !important; }
    .card { background-color: #161b22; border: 1px solid #30363d; }
    .card-header { background-color: #1c2128; border-bottom: 1px solid #30363d; color: #cdd9e5; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .table { color: #f0f6fc; font-size: 13px; }
    .table > :not(caption) > * > * { background-color: transparent; border-color: #30363d; padding: 8px 10px; color: #f0f6fc; }
    .table tbody tr:hover > * { background-color: #1c2128; }
    .table thead th { color: #cdd9e5; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .badge-buy { background-color: #1a7f37 !important; color: #fff; }
    .badge-sell { background-color: #b91c1c !important; color: #fff; }
    .badge-modify { background-color: #9a6700 !important; color: #fff; }
    .badge-close { background-color: #6e7681 !important; color: #fff; }
    .text-profit { color: #3fb950 !important; }
    .text-loss { color: #f85149 !important; }
    .text-muted-soft { color: #cdd9e5; }
    .summary-card .card-body { padding: 1.2rem 1.4rem; }
    .summary-value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; color: #f0f6fc; }
    .summary-label { font-size: 11px; color: #adbac7; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; color: #f0f6fc; }
    .signal-content { font-size: 12px; color: #cdd9e5; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .signal-time { font-size: 11px; color: #adbac7; margin-top: 2px; }
    footer { color: #adbac7; font-size: 12px; border-top: 1px solid #30363d; }
    .mode-toggle form { display: inline; }
    .btn-mode { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid #30363d; cursor: pointer; transition: all 0.2s; }
    .btn-mode.demo { background-color: #9a6700; color: #fff; border-color: #9a6700; }
    .btn-mode.real { background-color: #1a7f37; color: #fff; border-color: #1a7f37; }
    .btn-mode:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-semibold" href="/">
        <span style="color:#58a6ff">◆</span> WhopScraper
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-3 me-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/positions' %}active{% endif %}" href="/positions">持仓</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/orders' %}active{% endif %}" href="/orders">交易记录</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/signals' %}active{% endif %}" href="/signals">信号</a>
          </li>
        </ul>
        <!-- Demo / Real 切换开关 -->
        <div class="mode-toggle ms-3">
          <form action="/toggle-mode" method="post">
            <button type="submit" class="btn-mode {% if demo_mode %}demo{% else %}real{% endif %}">
              {% if demo_mode %}🧪 演示数据{% else %}💹 真实数据{% endif %}
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </div>

  <footer class="py-3 mt-4">
    <div class="container-fluid px-4 d-flex justify-content-between">
      <span>WhopScraper Trading Dashboard &nbsp;·&nbsp; 富途牛牛 (Futu)</span>
      <span>数据只读 · 无需券商连接 &nbsp;·&nbsp; 每60秒自动刷新</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
